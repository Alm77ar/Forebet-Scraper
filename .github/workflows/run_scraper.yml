name: Forebet Daily Scraper

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      target_day:
        description: "Select the matches page"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - tomorrow

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for FlareSolverr Readiness
        run: |
          echo "Waiting for FlareSolverr..."
          until curl -s http://localhost:8191/ | grep -q "FlareSolverr"; do
            sleep 2
          done
          echo "FlareSolverr is ready!"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium

      - name: Scrape Forebet and send Telegram message
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
        run: python -u scraper.py "${{ github.event.inputs.target_day || 'today' }}"

      # Runs even if the scrape/send step above fails, so you can still inspect
      # what the page looked like on a failed run, not just successful ones.
      - name: Upload debug artifacts (screenshots, HTML, step counts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forebet-debug-${{ github.run_id }}
          path: debug_artifacts/
          retention-days: 7
