name: Schedule Test

on:
  schedule:
    - cron: "42 11 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test scheduled execution
        run: |
          echo "================================"
          echo "SCHEDULED WORKFLOW IS RUNNING"
          echo "Event: ${{ github.event_name }}"
          echo "Time:"
          date -u
          echo "================================"
