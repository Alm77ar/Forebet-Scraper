name: Forebet Daily Scraper

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      target_day:
        description: "Select the matches page"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - tomorrow

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cloudscraper requests beautifulsoup4

      - name: Scrape Forebet and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u scraper.py "${{ github.event.inputs.target_day || 'today' }}"
